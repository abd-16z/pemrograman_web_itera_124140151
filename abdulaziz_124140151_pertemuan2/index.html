<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meja Kuliah — Personal Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="top">
    <div>
      <h1 id="greeting">Halo!</h1>
      <p id="today" class="muted"></p>
    </div>
    <div class="clock" id="clock" aria-live="off">--:--:--</div>
  </header>

  <section class="quote" aria-label="Kutipan harian">
    <p id="quoteText">Memuat kutipan…</p>
    <small id="quoteAuthor"></small>
  </section>

  <main class="grid">
    <section class="panel tasks">
      <div class="panel-head">
        <h2>Tugas &amp; deadline</h2>
        <span id="taskCount" class="muted"></span>
      </div>
      <div class="bar"><span id="progress"></span></div>

      <form id="taskForm" class="form-row" autocomplete="off">
        <input type="hidden" id="taskId">
        <input id="taskTitle" placeholder="Judul tugas" required maxlength="80">
        <input id="taskCourse" placeholder="Mata kuliah" maxlength="40">
        <input id="taskDeadline" type="date">
        <button type="submit" id="taskSubmit" class="btn primary">Tambah tugas</button>
        <button type="button" id="taskCancel" class="btn" hidden>Batal</button>
      </form>

      <div class="chips" role="group" aria-label="Filter tugas">
        <button class="chip active" data-filter="all">Semua</button>
        <button class="chip" data-filter="active">Belum selesai</button>
        <button class="chip" data-filter="done">Selesai</button>
      </div>
      <ul id="taskList" class="list"></ul>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>Cuaca kampus</h2></div>
        <div id="weather" class="weather">Memuat cuaca…</div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Catatan cepat</h2></div>
        <form id="noteForm" class="form-col" autocomplete="off">
          <textarea id="noteText" rows="2" placeholder="Tulis catatan…" required></textarea>
          <button class="btn primary" type="submit">Simpan catatan</button>
        </form>
        <ul id="noteList" class="list notes"></ul>
      </section>
    </aside>
  </main>

  <footer class="muted">Data tersimpan di browser (localStorage).</footer>
</div>
  <script src="script.js"></script>
</body>
</html>
